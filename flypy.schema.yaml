# Rime schema settings
# encoding: utf-8
# 小鹤音形码表，功能结构参照本目录的 tiger.schema.yaml。

schema:
  schema_id: flypy
  name: 小鹤音形
  version: "10.13.4"
  author:
    - 方案设计：何海峰 flypy.cc
  description: |
    小鹤音形输入法，保留四码上屏和分号快符。
    ~ 引导拼音反查，候选注释显示小鹤音形码，例如 ~ni。
    反引号 ` 作为通配位直接反查小鹤编码，支持前缀与后缀，例如 jx``、``rx。
    单引号 ' 引导临时英文，方括号 [ 或 ] 重复上屏。
    & 引导野鹤组字码（覆盖基本区至扩展 J 区），例如 &hguu。
    “全字集”启用社区字集补充（基本区繁体／生僻字与扩展区）；“常用字”保持原有候选。
  dependencies:
    - flypydz
    - flypy_ext
    - flypy_big
    - flypy_yehe
    - core2022
    - PY_c
    - easy_english

# 与虎码共用功能名和快捷键；只列出本方案实际接入的开关。
# 虎码的 hu_cf.json 是虎码拆字表，不用于小鹤音形。
switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: extended_char
    reset: 1
    states: [ 全字集, 常用字 ]
  - name: flypy_big
    reset: 0
    states: [ 标准词库, 大词库 ]
  - name: pinyin
    reset: 0
    states: [ 拼, pīn ]
  - name: emoji_cn
    reset: 0
    states: [ 🈚, 🈶 ]
  - name: simplification
    reset: 0
    states: [ 简中, 繁中 ]
  - name: charset_comment_filter
    reset: 0
    states: [ U区关, U区开 ]
  - name: udpf_switch
    reset: 0
    states: [ U编关, U编开 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]
  - name: full_shape
    reset: 0
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - affix_segmentor@easy_english
    - affix_segmentor@flypy_yehe
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - reverse_lookup_translator@flypy_lookup
    - reverse_lookup_translator@flypy_ext_lookup
    - lua_translator@*flypy_mode_translator
    - table_translator@easy_english
    - table_translator@flypy_yehe
    - history_translator@history
    - history_translator@historyDM
    - history_translator@historyDM2
    - history_translator@historyDM3
    - lua_translator@*number
    - lua_translator@*calculator_translator
    - lua_translator@*shijian2
    - lua_translator@*flypy_date_translator
    - lua_translator@*flypy_time_translator
  filters:
    - lua_filter@*flypy_ext_filter
    - lua_filter@*core2022_filter
    - simplifier@simplification
    - simplifier@pinyin
    - simplifier@emoji_cn
    - lua_filter@*charset_comment_filter
    - lua_filter@*unicode_display
    - uniquifier

speller:
  max_code_length: 4
  auto_select: true
  auto_select_pattern: ^;.$|^\w{4}$
  auto_clear: max_length
  # 保留小鹤分号快符和引号编码；方括号用于重复上屏。
  alphabet: "[;'abcdefghijklmnopqrstuvwxyz]"
  finals: "'"

translator:
  dictionary: flypy
  __patch: local:/flypy?
  enable_charset_filter: false
  enable_completion: false # 只显示当前完整编码，不补全后续编码的字词
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  encode_commit_history: false
  comment_format:
    - "xform/~/ /"

# 拼音词库沿用虎码；用 ~ 引导，与反引号 ` 小鹤通配反查彻底分开。
reverse_lookup:
  dictionary: PY_c
  target: translator
  prefix: "~"
  tips: "〔拼音〕"
  preedit_format:
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1u/"
  comment_format:
    - "xform/^/ /"

key_binder:
  bindings:
    - { when: has_menu, accept: semicolon, send: 2 }
    - { when: has_menu, accept: apostrophe, send: 3 }
    - { when: composing, accept: Tab, send: Escape }
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: composing, accept: "Control+o", toggle: simplification }
    - { when: composing, accept: "Control+p", toggle: pinyin }
    - { when: composing, accept: "Control+i", toggle: emoji_cn }
    - { when: composing, accept: "Control+u", toggle: charset_comment_filter }
    - { when: composing, accept: "Control+y", toggle: udpf_switch }
    - { when: composing, accept: "Control+h", toggle: extended_char }
    - { when: composing, accept: "Control+Shift+H", toggle: extended_char }
    - { when: composing, accept: "Control+Shift+B", toggle: flypy_big }
    - { when: has_menu, accept: Right, send: Down }
    - { when: has_menu, accept: Left, send: Up }
    - { when: always, accept: "Control+period", toggle: ascii_punct }

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[A-Za-z]+)$"
    reverse_lookup: "^~[a-z]*$"
    easy_english: "^'[A-Za-z]*`?$"
    flypy_yehe: "^&[a-z]*$"
    flypy_lookup: "^[a-z`]*`[a-z`]*$"
    expression: "^=.*$"
    number: '^S[0-9]+[.]?[0-9]*$'

historyDM:
  input: "["
  size: 1
  initial_quality: 999

historyDM2:
  input: "'"
  size: 1
  initial_quality: -999

historyDM3:
  input: "]"
  size: 1
  initial_quality: 999

simplification:
  opencc_config: s2tw.json # 保留小鹤原有的台湾正体转换
  option_name: simplification
  tips: all

pinyin:
  opencc_config: pinyin.json
  option_name: pinyin
  show_in_comment: true
  comment_format:
    - 'xform/&nbsp;/ /'
  tips: char
  tags:
    - abc
    - flypy

emoji_cn:
  opencc_config: emoji.json
  option_name: emoji_cn
  tips: all

easy_english:
  dictionary: easy_english
  tag: easy_english
  prefix: "'"
  tips: "〔En〕"
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false
  initial_quality: -1
  preedit_format:
    - "xlit|_| |"
  comment_format:
    - "xform/~/ /"

flypy_yehe:
  dictionary: flypy_yehe
  tag: flypy_yehe
  prefix: "&"
  tips: "〔组字〕"
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  encode_commit_history: false

menu:
  page_size: 9
  alternative_select_labels: [ ㊀, ㊁, ㊂, ㊃, ㊄, ㊅, ㊆, ㊇, ㊈ ]

punctuator:
  import_preset: symbols

# 原小鹤通配反查：无需前缀，直接用反引号 ` 代替未知码位（如 jx``、``rx）。
flypy_lookup:
  tag: flypy_lookup
  dictionary: flypydz
  target: translator
  tips: "〔小鹤通配〕"
  comment_format:
    - "xform/^/ /"

flypy_ext_lookup:
  tag: flypy_lookup
  dictionary: flypy_ext
  __patch: local:/flypy_ext?
  target: translator
  tips: "〔小鹤通配〕"
  initial_quality: -1 # 扩展字反查排在原有反查候选之后
  comment_format:
    - "xform/^/ /"

# 保留原来的 ;f 重复上屏入口。
history:
  input: ";f"
  size: 1
  initial_quality: 1

style:
  text_orientation: horizontal
  candidate_list_layout: linear
