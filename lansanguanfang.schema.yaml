# Rime schema settings
# encoding: utf-8
# 蓝三官方单字表，合并 ls_ci 与官方词组；功能结构参照 tiger.schema.yaml。

schema:
  schema_id: lansanguanfang
  name: "蓝三官方"
  version: "1.3"
  author:
    - KyleBing
  description: |
    蓝宝石第三代官方单字表，合并标准词频词库与官方词组。
    反引号 ` 引导拼音反查，候选注释显示蓝三码。
    单引号 ' 引导临时英文，方括号 [ 或 ] 重复上屏。
  dependencies:
    - core2022
    - PY_c
    - easy_english

# 与虎码共用功能名和快捷键；只列出本方案实际接入的开关。
# 虎码的 hu_cf.json 是虎码拆字表，不用于蓝三。
switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: extended_char
    reset: 1
    states: [ 全字集, 常用字 ]
  - name: dz_ci
    reset: 0
    states: [ 字词混输, 纯单字 ]
  - name: pinyin
    reset: 0
    states: [ 拼, pīn ]
  - name: emoji_cn
    reset: 0
    states: [ 🈚, 🈶 ]
  - name: simplification
    reset: 0
    states: [ 简中, 繁中 ]
  - name: charset_comment_filter
    reset: 0
    states: [ U区关, U区开 ]
  - name: udpf_switch
    reset: 0
    states: [ U编关, U编开 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]
  - name: full_shape
    reset: 0
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - affix_segmentor@easy_english
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
    - table_translator@easy_english
    - history_translator@historyDM
    - history_translator@historyDM2
    - history_translator@historyDM3
    - lua_translator@*number
    - lua_translator@*calculator_translator
    - lua_translator@*shijian2
  filters:
    - lua_filter@*core2022_filter
    - lua_filter@*dz_ci_filter
    - lua_filter@*lansan_single_order_filter
    - simplifier@simplification
    - simplifier@pinyin
    - simplifier@emoji_cn
    - lua_filter@*charset_comment_filter
    - lua_filter@*unicode_display
    - uniquifier

speller:
  max_code_length: 4
  auto_select: false
  auto_clear: max_length
  # 字母保持蓝三编码；方括号和单引号用于虎码式辅助功能。
  alphabet: "['abcdefghijklmnopqrstuvwxyz]"

translator:
  dictionary: lansan_merged
  __patch: local:/lansanguanfang?
  enable_charset_filter: false
  enable_completion: false # 只显示当前完整编码，不补全后续编码的字词
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  encode_commit_history: false
  comment_format:
    - "xform/~/ /"

# 拼音词库沿用虎码；反查目标是上面的蓝三合并词典。
reverse_lookup:
  dictionary: PY_c
  target: translator
  prefix: "`"
  tips: "〔拼音〕"
  preedit_format:
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1u/"
  comment_format:
    - "xform/^/ /"

key_binder:
  bindings:
    - { when: has_menu, accept: semicolon, send: 2 }
    - { when: has_menu, accept: apostrophe, send: 3 }
    - { when: composing, accept: Tab, send: Escape }
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: composing, accept: "Control+o", toggle: simplification }
    - { when: composing, accept: "Control+p", toggle: pinyin }
    - { when: composing, accept: "Control+i", toggle: emoji_cn }
    - { when: composing, accept: "Control+u", toggle: charset_comment_filter }
    - { when: composing, accept: "Control+y", toggle: udpf_switch }
    - { when: composing, accept: "Control+h", toggle: extended_char }
    - { when: composing, accept: "Control+Shift+H", toggle: extended_char }
    - { when: always, accept: "Control+Shift+D", toggle: dz_ci }
    - { when: has_menu, accept: Right, send: Down }
    - { when: has_menu, accept: Left, send: Up }
    - { when: always, accept: "Control+period", toggle: ascii_punct }

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[A-Za-z]+)$"
    reverse_lookup: "^`[a-z]*$" # 单引号保留给三选，避免被反查识别器吞掉
    easy_english: "^'[A-Za-z]*`?$"
    expression: "^=.*$"
    number: '^S[0-9]+[.]?[0-9]*$'

historyDM:
  input: "["
  size: 1
  initial_quality: 999

historyDM2:
  input: "'"
  size: 1
  initial_quality: -999

historyDM3:
  input: "]"
  size: 1
  initial_quality: 999

simplification:
  opencc_config: st_tu.json
  option_name: simplification
  tips: all

pinyin:
  opencc_config: pinyin.json
  option_name: pinyin
  show_in_comment: true
  comment_format:
    - 'xform/&nbsp;/ /'
  tips: char
  tags:
    - abc
    - lansanguanfang

emoji_cn:
  opencc_config: emoji.json
  option_name: emoji_cn
  tips: all

easy_english:
  dictionary: easy_english
  tag: easy_english
  prefix: "'"
  tips: "〔En〕"
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false
  initial_quality: -1
  preedit_format:
    - "xlit|_| |"
  comment_format:
    - "xform/~/ /"

menu:
  page_size: 9
  alternative_select_labels: [ ㊀, ㊁, ㊂, ㊃, ㊄, ㊅, ㊆, ㊇, ㊈ ]

punctuator:
  import_preset: symbols
